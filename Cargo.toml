[workspace]
members = [
    "crates/*"
]

resolver = "2"

[workspace.package]
version = "0.0.2-alpha.9"
authors = ["Benedikt Schwab <benedikt.schwab@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/envis-space/ecitygml"

[profile.release]
# debug = 1

[profile.release-lto]
inherits = "release"
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1

[workspace.dependencies]
egml = { version = "0.0.2-alpha.9" }

thiserror = "2.0.21"
anyhow = "1.0.104"
clap = "4.6.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
nalgebra = "0.35.0"
quick-xml = "0.42.0"
itertools = "0.15.0"
strum = "0.28.0"
strum_macros = "0.28.0"
rayon = "1.12.0"
walkdir = "2.5.0"
regex = "1.13.1"
uuid = "1.27.0"
palette = "0.7.7"
colorous = "1.0.16"
zstd = "0.14.0"
ruzstd = "0.9.0"
flate2 = "1.1.10"
libc = "0.2.190"
humansize = "2.1.3"
chrono = "0.4.45"
bvh = "0.13.0"
rfd = { version = "0.17.2", default-features = false }
three-d = "0.19.0"
slotmap = "1.1.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = "0.3.106"
console_error_panic_hook = "0.1.7"
tracing-web = "0.1.3"
diplomat = "0.17.0"
diplomat-runtime = "0.16.1"
