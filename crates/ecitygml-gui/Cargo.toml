[package]
name = "ecitygml-gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop and web GUI for viewing CityGML datasets."

[[bin]]
name = "ecitygml-gui"
path = "src/main.rs"

[dependencies]
ecitygml = { version = "0.0.2-alpha.9", path = "../ecitygml" }
ecitygml-core = { version = "0.0.2-alpha.9", path = "../ecitygml-core" }
egml = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
three-d = { workspace = true, features = ["egui-gui"] }
rfd = { workspace = true, features = ["xdg-portal"] }
bvh = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nalgebra = { workspace = true }
chrono = { workspace = true }
image = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "Document", "HtmlAnchorElement", "Url", "Window"] }
console_error_panic_hook = { workspace = true }
tracing-web = { workspace = true }
