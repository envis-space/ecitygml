[package]
name = "ecitygml-io"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IO operations for processing CityGML data."


[dependencies]
ecitygml-core = { version = "0.0.2-alpha.9", path = "../ecitygml-core" }

egml = { workspace = true }

thiserror = { workspace = true }
quick-xml = { workspace = true, features = ["serialize"] }
nalgebra = { workspace = true }
# parry3d-f64 = { workspace = true, features = ["f64"] }
itertools = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
rayon = { workspace = true }
strum = { workspace = true, features = ["derive"] }
chrono = { workspace = true, default-features = false, features = ["std"] }

# zstd is C code; WebAssembly uses the pure-Rust implementation instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = { workspace = true }
