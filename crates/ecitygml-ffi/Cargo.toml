[package]
name = "ecitygml-ffi"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Language bindings for ecitygml."

# Only the Rust sources: the generated bindings, their tests and examples (bindings/, tests/) stay out of the package.
# The leading slashes anchor the patterns to this directory (like .gitignore, `README.md` alone matches at any depth).
include = ["/src/**", "/Cargo.toml", "/config.toml", "/README.md"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ecitygml = { version = "0.0.2-alpha.9", path = "../ecitygml" }
egml = { workspace = true }

nalgebra = { workspace = true }
diplomat = { workspace = true }
diplomat-runtime = { workspace = true }
