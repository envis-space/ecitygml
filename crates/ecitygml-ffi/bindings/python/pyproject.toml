# Python package for the nanobind bindings generated by Diplomat into src/ (`mise run generate:bindings`).
# The extension statically links the Rust library: run `cargo build -p ecitygml-ffi` first (see CMakeLists.txt for release).

[build-system]
# The generated code uses nanobind internals and is tested by Diplomat against nanobind 2.4.0.
requires = ["scikit-build-core>=0.10", "nanobind==2.4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ecitygml"
# The version of the Rust workspace (see [tool.scikit-build.metadata.version])
dynamic = ["version"]
description = "Python bindings for ecitygml, generated with Diplomat (nanobind)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
authors = [{ name = "Benedikt Schwab", email = "benedikt.schwab@gmail.com" }]
keywords = ["citygml", "gml", "3d-city-model", "gis"]

[project.urls]
Repository = "https://github.com/tum-gis/ecitygml"

[dependency-groups]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# Stable ABI: one wheel for CPython 3.12+.
wheel.py-api = "cp312"

# The version of the workspace (the first `version = ` line of the root Cargo.toml, in [workspace.package]).
# PEP 440 normalizes the Cargo pre-release form (-alpha.N → aN).
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../../../Cargo.toml"
regex = '(?m)^version = "(?P<value>[^"]+)"'
