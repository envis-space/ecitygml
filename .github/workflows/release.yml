name: Release

on:
  push:
    tags:
    - '[0-9]+.[0-9]+.[0-9]+*'

# Only the jobs that publish (the release and the web viewer deployment) get write access
permissions:
  contents: read

env:
  MISE_VERSION: 2026.10.4
  # The tag is passed to the scripts as a variable, never interpolated into them
  TAG: ${{ github.ref_name }}

jobs:

  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Verify tag matches Cargo.toml
      shell: bash
      run: |
        if ! grep -q "^version = \"$TAG\"" Cargo.toml; then
          echo "Tag $TAG does not match version in Cargo.toml" >&2
          exit 1
        fi

  # Only tagged commits that pass the checks and tests are released
  ci:
    name: CI
    needs: check-version
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
        - target: aarch64-unknown-linux-gnu
          os: ubuntu-24.04-arm
        - target: x86_64-apple-darwin
          os: macos-latest
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest

    steps:
    - uses: actions/checkout@v7

    # The toolchain declared in mise.toml, as in CI; plus the release target
    - uses: jdx/mise-action@v5
      with:
        version: ${{ env.MISE_VERSION }}
    - run: rustup target add ${{ matrix.target }}

    - name: Build
      env:
        CMAKE_TOOLCHAIN_FILE: ${{ runner.os == 'Windows' && 'C:\vcpkg\scripts\buildsystems\vcpkg.cmake' || '' }}
        RUSTFLAGS: ${{ runner.os == 'Windows' && '-L C:\vcpkg\installed\x64-windows-static-md\lib' || '' }}
      run: cargo build --profile release-lto --bin ecitygml-gui --target ${{ matrix.target }}

    - name: Package binary (Unix)
      if: runner.os != 'Windows'
      env:
        TARGET: ${{ matrix.target }}
      run: |
        BINARY="target/$TARGET/release-lto/ecitygml-gui"
        ARCHIVE="ecitygml-gui-$TAG-$TARGET.tar.gz"
        tar -czf "$ARCHIVE" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
        shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
        echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

    - name: Package binary (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        TARGET: ${{ matrix.target }}
      run: |
        $binary = "target\$env:TARGET\release-lto\ecitygml-gui.exe"
        $archive = "ecitygml-gui-$env:TAG-$env:TARGET.zip"
        Compress-Archive -Path $binary -DestinationPath $archive
        certutil -hashfile $archive SHA256 > "$archive.sha256"
        echo "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

    - uses: actions/upload-artifact@v7
      with:
        name: ecitygml-${{ matrix.target }}
        path: |
          ${{ env.ARCHIVE }}
          ${{ env.ARCHIVE }}.sha256
        if-no-files-found: error

  # The web viewer of the released version, deployed to GitHub Pages (Settings > Pages > Source: GitHub Actions)
  build-gui-web:
    needs: ci
    name: Build web viewer
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # The toolchain declared in mise.toml (including the wasm32 target); the task installs Trunk
    - uses: jdx/mise-action@v5
      with:
        version: ${{ env.MISE_VERSION }}

    - name: Build
      run: mise run build:gui-web

    - uses: actions/upload-pages-artifact@v4
      with:
        path: target/gui-web

  # Separate from the build, so that only the deployment gets write access to Pages
  deploy-gui-web:
    needs: build-gui-web
    name: Deploy web viewer
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a running one is finished rather than cancelled
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        pattern: ecitygml-*
        merge-multiple: true

    # SemVer: every pre-release version (alpha, beta, rc, ...) contains a hyphen
    - uses: softprops/action-gh-release@v3
      with:
        files: artifacts/*
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
