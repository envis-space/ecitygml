name: Release

# Publishes a release for an existing version tag (vX.Y.Z[-pre]).
# The version bump, commit and tag are created when the repository contents are copied to the public repository.
#
# Every job is idempotent: re-running the workflow (Re-run jobs) skips whatever is already published.
#
# Publishing to crates.io (and PyPI) is opt-in: it only runs when the repository variable CRATES_IO_PUBLISH (PYPI_PUBLISH) is
# 'true' (Settings → Secrets and variables → Actions → Variables), otherwise the job is skipped and
# the GitHub release is still created. Once enabled, a failed publish fails the workflow.
# The web viewer is deployed to GitHub Pages only in repositories with Pages enabled (Settings → Pages →
# Source: GitHub Actions; the github-pages environment must allow v* tags).
#
# Publish jobs stay in this file, as crates.io and PyPI trusted publishing are bound to it (release.yml)
# and the `release` environment. The builds live in reusable workflows (build-*.yml).

on:
  push:
    tags:
    - "v*"

permissions: {}

# An explicit bash shell runs with pipefail, so failures before a pipe (e.g. into tee) fail the step
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # The tag is passed to the scripts as a variable, never interpolated into them
  TAG: ${{ github.ref_name }}
  MISE_VERSION: 2026.10.4
  CARGO_RELEASE_VERSION: 1.1.7
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

jobs:

  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: refs/tags/${{ env.TAG }}
        fetch-depth: 0
        persist-credentials: false
    - uses: jdx/mise-action@v5
      with:
        version: ${{ env.MISE_VERSION }}
    - name: Check that the tag matches the workspace version
      id: version
      run: |
        if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Tag '${TAG}' is not of the form vX.Y.Z[-pre]"
          exit 1
        fi
        versions=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u)
        if [ "${versions}" != "${TAG#v}" ]; then
          echo "::error::Tag '${TAG}' does not match the crate versions: ${versions//$'\n'/, }"
          exit 1
        fi
        echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
        if [[ "${TAG}" == *-* ]]; then
          echo "prerelease=true" >> "${GITHUB_OUTPUT}"
        else
          echo "prerelease=false" >> "${GITHUB_OUTPUT}"
        fi
    - name: Check that the tagged commit is on main
      run: |
        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo "::error::Tag '${TAG}' points to a commit that is not on main"
          exit 1
        fi
    - name: Package the crates
      run: cargo package --workspace

  # The checks and tests, the same as for every push and pull request (including the bindings)
  ci:
    name: CI
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The called workflows check out the tag, as they run with the ref of this workflow
  build-cli:
    name: Build CLI
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/build-cli.yml
    with:
      version: ${{ github.ref_name }}

  build-gui:
    name: Build GUI
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/build-gui.yml
    with:
      version: ${{ github.ref_name }}

  build-gui-web:
    name: Build web viewer
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/build-gui-web.yml

  build-wheels:
    name: Build Python wheels
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheels.yml

  publish-crates:
    name: Publish to crates.io
    needs: ci
    if: vars.CRATES_IO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: refs/tags/${{ env.TAG }}
        persist-credentials: false
    - uses: jdx/mise-action@v5
      with:
        version: ${{ env.MISE_VERSION }}
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-release@${{ env.CARGO_RELEASE_VERSION }}
    - uses: rust-lang/crates-io-auth-action@v1
      id: auth
    # cargo-release refuses to run on a detached HEAD, which is what checking out a tag yields
    - run: git checkout -B release
    # Crates whose version is already on crates.io are skipped, so re-runs are safe.
    # If all of them are, cargo-release fails with "no packages selected", which counts as done.
    # The log lives outside the checkout, as cargo-release refuses to run with untracked files.
    - name: Publish
      run: |
        log="${RUNNER_TEMP}/publish.log"
        status=0
        cargo release publish --workspace --execute --no-confirm 2>&1 | tee "${log}" || status=$?
        if [ "${status}" -ne 0 ]; then
          if grep -q "no packages selected" "${log}"; then
            echo "All crates are already published"
          else
            exit "${status}"
          fi
        fi
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Trusted publishing, like crates.io: PyPI → ecitygml → Publishing (a pending publisher before the first upload), with
  # this repository, release.yml and the `release` environment
  publish-pypi:
    name: Publish to PyPI
    needs: build-wheels
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: python-wheel-*
        merge-multiple: true
    # Wheels whose version is already on PyPI are skipped, so re-runs are safe
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  github-release:
    name: Create GitHub release
    needs: [verify, build-cli, build-gui, publish-crates]
    # Also runs when publish-crates was skipped (CRATES_IO_PUBLISH not enabled), but not when it failed
    if: >-
      ${{ !cancelled() && needs.build-cli.result == 'success' && needs.build-gui.result == 'success'
      && needs.publish-crates.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        pattern: ecitygml-cli-*
        merge-multiple: true
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        pattern: ecitygml-gui-*
        merge-multiple: true
    # On a re-run, the archives are (re-)uploaded to the existing release instead
    - name: Create the release unless it exists
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      run: |
        if gh release view "${TAG}" > /dev/null 2>&1; then
          echo "Release ${TAG} already exists, uploading the CLI and GUI archives"
          gh release upload "${TAG}" artifacts/* --clobber
          exit 0
        fi
        flags=()
        if [ "${PRERELEASE}" = "true" ]; then
          flags+=(--prerelease)
        fi
        gh release create "${TAG}" --verify-tag --generate-notes --title "${TAG}" "${flags[@]}" artifacts/*

  # The web viewer of the released version, once the release exists
  deploy-gui-web:
    name: Deploy web viewer
    needs: [build-gui-web, github-release]
    if: ${{ !cancelled() && needs.github-release.result == 'success' && github.event.repository.has_pages }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a running one is finished rather than cancelled
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
