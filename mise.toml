min_version = "2026.9.0"

[tools]
rust = { version = "stable", profile = "minimal", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }

# --- Entry points ---

[tasks.default]
description = "Check, build, test and document the Rust workspace"
run = [
	{ task = "check" },
	{ task = "build" },
	{ task = "test" },
	{ task = "doc" },
]

[tasks.full]
description = "Check, build and test everything: the Rust workspace and the web viewer, then generate, build and test all bindings"
run = '''
mise run check
mise run build
mise run test
mise run build:gui-web
mise run generate:bindings
mise run --jobs 1 'test:bindings:*'
'''

# --- Code quality ---

[tasks.check]
description = "Run all read-only checks (formatting, clippy for native and WebAssembly, documentation, conformance suites)"
depends = [
	"check:fmt",
	"check:clippy",
	"check:wasm",
	"check:doc",
	"check:cases",
]

[tasks."check:cases"]
description = "Check that every suite's conformance and API tests match the case lists in crates/ecitygml/tests/{conformance,api}"
run = "cargo test -p ecitygml --test case_list_check"

[tasks."check:fixtures"]
description = "Validate the hand-written fixtures in tests/fixtures/synthetic against the CityGML 3.0 schemas (xmllint; fetches the schemas from schemas.opengis.net)"
run = "xmllint --noout --schema tests/fixtures/scripts/citygml-3.0.xsd tests/fixtures/synthetic/*.gml"

[tasks."check:fmt"]
description = "Check the formatting"
run = "cargo fmt --all -- --check"

[tasks."check:clippy"]
description = "Lint the workspace with clippy"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."check:wasm"]
description = "Lint the workspace with clippy for WebAssembly (covers the cfg(target_arch = \"wasm32\") code)"
run = "cargo clippy --workspace --all-targets --target wasm32-unknown-unknown -- -D warnings"

[tasks."check:doc"]
description = "Check the documentation (broken intra-doc links, invalid HTML)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --all-features"

[tasks.fix]
description = "Apply compiler and clippy fixes and format the code (rewrites files; see check for the read-only variant)"
alias = "lint"
run = '''
cargo fix --workspace --all-targets --all-features --allow-dirty
cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged
cargo fmt --all
'''

# --- Build, test and documentation ---

[tasks.build]
description = "Build the project"
usage = '''
flag "-r --release" help="Build artifacts in release mode, with optimizations"
'''

run = '''
if [ "${usage_release}" = 'true' ]; then
    cargo build --release;
else
    cargo build;
fi
'''

[tasks."build:gui-web"]
description = "Build the web version of the viewer (static files in target/gui-web, e.g. for hosting)"
tools = { "github:trunk-rs/trunk" = "0.21.14" }
dir = "crates/ecitygml-gui"
# The 32 MiB stack is set in .cargo/config.toml.
run = '''
trunk build --release
'''

[tasks.test]
description = "Run the unit and integration tests"
run = "cargo test --workspace --all-features"

[tasks.doc]
description = "Build the documentation"
run = '''
cargo doc --no-deps --all-features
echo '<meta http-equiv="refresh" content="0; url=ecitygml/index.html">' > target/doc/index.html
'''

# --- Run and serve ---

[tasks."run:cli"]
description = "Run the CLI (arguments are passed through, e.g. mise run run:cli -- --help)"
run = "cargo run -p ecitygml-cli --"

[tasks."run:gui"]
description = "Run the native viewer"
run = "cargo run -p ecitygml-gui"

[tasks."serve:doc"]
description = "Serve the documentation on a local web server"
depends = ["doc"]
tools = { "cargo:miniserve" = "0" }
run = '''
miniserve ./target/doc --index index.html
'''

[tasks."serve:gui-web"]
description = "Serve the web version of the viewer on http://127.0.0.1:8080 and open it, rebuilding on changes"
usage = '''
flag "-r --release" help="Build in release mode, with optimizations (slower rebuilds, faster viewer)"
'''
tools = { "github:trunk-rs/trunk" = "0.21.14" }
dir = "crates/ecitygml-gui"
# Own dist directory: target/gui-web stays the release build of build:gui-web.
run = '''
if [ "${usage_release}" = 'true' ]; then
    trunk serve --release --dist ../../target/gui-web-serve;
else
    trunk serve --dist ../../target/gui-web-serve;
fi
'''

# --- Bindings ---

[tasks."generate:bindings"]
description = "Generate the bindings of all languages from the Diplomat bridges in ecitygml-ffi"
tools = { "cargo:diplomat-tool" = "0.16.1" }
dir = "crates/ecitygml-ffi"
run = '''
rm -rf bindings/c/include bindings/cpp/include bindings/python/src bindings/kotlin/src/main bindings/typescript/lib bindings/dotnet/src bindings/dart/lib/src
diplomat-tool --silent c bindings/c/include
diplomat-tool --silent cpp bindings/cpp/include
diplomat-tool --silent nanobind bindings/python/src
diplomat-tool --silent kotlin bindings/kotlin
diplomat-tool --silent js bindings/typescript/lib
diplomat-tool --silent dotnet bindings/dotnet/src
diplomat-tool --silent dart bindings/dart/lib/src
'''

[tasks."check:bindings"]
description = "Fail if the committed bindings are out of date with the Diplomat bridges"
depends = "generate:bindings"
run = '''
# Changed and new (untracked) files, without touching the Git index.
changes="$(git status --porcelain -- crates/ecitygml-ffi/bindings)"
if [ -n "$changes" ]; then
    echo "$changes"
    echo "Bindings are out of date: run 'mise run generate:bindings' and commit the result."
    exit 1
fi
'''

[tasks."build:bindings:c"]
description = "Build the C unit tests and examples against the C bindings (committed headers, see check:bindings) in target/bindings-c (debug) or target/bindings-c-release"
# mise installs CMake on demand (e.g. in CI)
tools = { cmake = "4" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
if [ "$profile" = release ]; then build_dir=target/bindings-c-release; build_type=Release; else build_dir=target/bindings-c; build_type=Debug; fi
cargo build -p ecitygml-ffi $release_flag
cmake -S crates/ecitygml-ffi/bindings/c -B "$build_dir" -DCMAKE_BUILD_TYPE="$build_type" -DECITYGML_FFI_LIBRARY_DIR="$PWD/target/$profile"
cmake --build "$build_dir"
'''

[tasks."test:bindings:c"]
description = "Test the C bindings: unit tests and examples on fixtures (CTest)"
tools = { cmake = "4" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
if [ "$profile" = release ]; then build_dir=target/bindings-c-release; else build_dir=target/bindings-c; fi
mise run build:bindings:c $release_flag
ctest --test-dir "$build_dir" --output-on-failure
'''

[tasks."build:bindings:cpp"]
description = "Build the C++ unit tests and examples against the C++ bindings (committed headers, see check:bindings) in target/bindings-cpp (debug) or target/bindings-cpp-release"
# mise installs CMake on demand (e.g. in CI); the unit tests fetch Catch2 when configuring
tools = { cmake = "4" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
if [ "$profile" = release ]; then build_dir=target/bindings-cpp-release; build_type=Release; else build_dir=target/bindings-cpp; build_type=Debug; fi
cargo build -p ecitygml-ffi $release_flag
cmake -S crates/ecitygml-ffi/bindings/cpp -B "$build_dir" -DCMAKE_BUILD_TYPE="$build_type" -DECITYGML_FFI_LIBRARY_DIR="$PWD/target/$profile"
cmake --build "$build_dir"
'''

[tasks."test:bindings:cpp"]
description = "Test the C++ bindings: unit tests (Catch2) and examples on fixtures (CTest)"
tools = { cmake = "4" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
if [ "$profile" = release ]; then build_dir=target/bindings-cpp-release; else build_dir=target/bindings-cpp; fi
mise run build:bindings:cpp $release_flag
ctest --test-dir "$build_dir" --output-on-failure
'''

[tasks."setup:bindings:python"]
description = "Set up the environment for building the Python bindings (venv with pytest)"
tools = { uv = "latest" }
dir = "crates/ecitygml-ffi/bindings/python"
run = '''
# uv-managed Python: ships the headers nanobind needs (Debian's system Python doesn't)
uv venv --clear --managed-python --python 3.13 .venv
uv pip install --python .venv pytest
'''

[tasks."build:bindings:python"]
description = "Build the Python bindings (nanobind, statically linked) into the venv (see setup:bindings:python)"
tools = { uv = "latest" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
cargo build -p ecitygml-ffi $release_flag
uv pip install --python crates/ecitygml-ffi/bindings/python/.venv --reinstall \
    -C cmake.define.ECITYGML_FFI_LIBRARY_DIR="$PWD/target/$profile" ./crates/ecitygml-ffi/bindings/python
'''

[tasks."test:bindings:python"]
description = "Test the Python bindings (pytest)"
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
mise run build:bindings:python $release_flag
cd crates/ecitygml-ffi/bindings/python
.venv/bin/python -m pytest tests
'''

[tasks."build:bindings:kotlin"]
description = "Build the Kotlin bindings (committed sources, see check:bindings)"
# mise installs these on demand (e.g. in CI)
tools = { java = "openjdk-21", gradle = "9.8.0" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
cargo build -p ecitygml-ffi $release_flag
gradle --project-dir crates/ecitygml-ffi/bindings/kotlin build -x test -PnativeLibraryDir="$PWD/target/$profile"
'''

[tasks."test:bindings:kotlin"]
description = "Test the Kotlin bindings (JUnit; loads target/<profile>/libecitygml_ffi via JNA)"
tools = { java = "openjdk-21", gradle = "9.8.0" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
mise run build:bindings:kotlin $release_flag
gradle --project-dir crates/ecitygml-ffi/bindings/kotlin test -PnativeLibraryDir="$PWD/target/$profile"
'''

[tasks."build:bindings:typescript"]
description = "Build the WebAssembly module for the TypeScript bindings (committed sources, see check:bindings)"
tools = { node = "22" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
# Pure Rust: the FFI crate builds without the `zstd` feature (C code) for WebAssembly.
# The 32 MiB stack is set in .cargo/config.toml.
cargo build -p ecitygml-ffi $release_flag --target wasm32-unknown-unknown
'''

[tasks."test:bindings:typescript"]
description = "Test the TypeScript bindings (Node >= 22.18 runs the .ts tests directly; ECITYGML_FFI_PROFILE selects the module)"
tools = { node = "22" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
mise run build:bindings:typescript $release_flag
cd crates/ecitygml-ffi/bindings/typescript
ECITYGML_FFI_PROFILE="$profile" node --test
'''

[tasks."build:bindings:dotnet"]
description = "Build the C# (.NET) bindings and their tests (committed sources, see check:bindings)"
tools = { dotnet = "10" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
cargo build -p ecitygml-ffi $release_flag
# An environment variable, so that the snippets the tests run with `dotnet run --file` get it too.
export NativeLibraryDir="$PWD/target/$profile/"
dotnet build crates/ecitygml-ffi/bindings/dotnet/tests/Ecitygml.Tests.csproj -nologo
'''

[tasks."test:bindings:dotnet"]
description = "Test the C# (.NET) bindings (xUnit; loads target/<profile>/libecitygml_ffi)"
tools = { dotnet = "10" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
mise run build:bindings:dotnet $release_flag
export NativeLibraryDir="$PWD/target/$profile/"
dotnet test crates/ecitygml-ffi/bindings/dotnet/tests/Ecitygml.Tests.csproj -nologo
'''

[tasks."build:bindings:dart"]
description = "Build the library for the Dart bindings and fetch their packages (committed sources, see check:bindings)"
tools = { dart = "3.13" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
cargo build -p ecitygml-ffi $release_flag
# Read by the build hook (hook/build.dart), which doesn't see the environment.
mkdir -p target/bindings-dart
echo "$profile" > target/bindings-dart/profile
dart pub get --directory crates/ecitygml-ffi/bindings/dart
'''

[tasks."test:bindings:dart"]
description = "Test the Dart bindings (package:test; the build hook bundles target/<profile>/libecitygml_ffi)"
tools = { dart = "3.13" }
usage = '''
flag "-r --release" help="Use the release build of the library, with optimizations (default: debug)"
'''
run = '''
if [ "${usage_release}" = 'true' ]; then profile=release; release_flag=--release; else profile=debug; release_flag=; fi
mise run build:bindings:dart $release_flag
cd crates/ecitygml-ffi/bindings/dart
dart analyze --fatal-infos
dart test
'''

# --- Maintenance ---

[tasks.clean]
description = "Remove generated artifacts"
run = "cargo clean"

[tasks.release]
description = "Bump the version, commit, tag and push"
usage = '''
arg "<level>" help="Either bump by LEVEL or set the VERSION for all selected packages" {
  choices "major" "minor" "patch" "release" "rc" "beta" "alpha"
}
'''
tools = { "cargo:cargo-release" = "1" }
# The raw block passes cargo-release's {{version}} placeholder through mise's template rendering
run = '''
cargo release ${usage_level?} --workspace --no-publish --tag-name '{% raw %}v{{version}}{% endraw %}' --execute
'''

[tasks.publish]
description = "Publish the current version to a Cargo registry"
usage = '''
arg "<registry>" help="Name of the Cargo registry to publish to, as configured in .cargo/config.toml"
'''
tools = { "cargo:cargo-release" = "1" }
run = '''
cargo release publish --registry "${usage_registry?}" --workspace --no-confirm --execute
'''
